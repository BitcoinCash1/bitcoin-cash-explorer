[package]
name = "gbt"
version = "3.0.0"
description = "An efficient re-implementation of the getBlockTemplate algorithm for BCH in Rust"
authors = ["mononaut", "melroy"]
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
priority-queue = "2.7.0"
bytes = "1.12.1"
napi = { version = "3.16.0", features = ["napi8", "tokio_rt"] }
napi-derive = "3.7.0"
bytemuck = "1.25.2"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"]}

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
codegen-units = 1
